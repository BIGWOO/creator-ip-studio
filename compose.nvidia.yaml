services:
  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    entrypoint: ["creator-ip-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      CREATOR_IP_API_URL: http://api:8080
      CREATOR_IP_WORKSPACE: /workspace
      CREATOR_IP_ARTIFACT_ROOT: /workspace/projects
      CREATOR_IP_WORKER_CAPABILITIES: nvidia,ffmpeg,avatar
      CREATOR_IP_WORKER_TOKEN: ${CREATOR_IP_WORKER_TOKEN:-local-development}
    volumes:
      - ${CREATOR_IP_HOST_WORKSPACE:-./workspace}:/workspace
      - ${CREATOR_IP_HOST_MODELS:-./models}:/models
    gpus: all
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

