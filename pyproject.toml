[project]
name = "creator-ip-studio"
version = "0.1.0"
description = "Portable, resumable personal-IP video production platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "BIGWOO" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
tts = ["edge-tts>=7.2,<8"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
studio = "creator_ip_studio.cli:app"
creator-ip-api = "creator_ip_studio.api:main"
creator-ip-worker = "creator_ip_studio.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_ip_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
